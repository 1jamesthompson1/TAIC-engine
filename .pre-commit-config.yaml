default_install_hook_types: [pre-commit, commit-msg]
repos:
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v3.6.0
  hooks:
    - id: conventional-pre-commit
      stages: [commit-msg]
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version. Keep in sync with pyproject.toml and .github/workflows/ci.yml.
  rev: v0.15.21
  hooks:
    # Run the linter.
    - id: ruff
      args: [--fix]
    # Sort imports
    - id: ruff
      args: [--select, I, --fix]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/srstevenson/nb-clean
  rev: 3.3.0
  hooks:
    - id: nb-clean
- repo: local
  hooks:
    - id: check-uv-lock
      name: Check UV Lock
      entry: |
        bash -c '
        if ! $HOME/.local/bin/uv lock --check; then
            echo "uv.lock is out of date. You need to update it"
            exit 1
        else
            echo "uv.lock is up-to-date with pyproject.toml."
        fi'
      language: system
      stages: [pre-commit]