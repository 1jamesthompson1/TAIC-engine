name: tests

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3.5.1
        with:
          # Keep in sync with .pre-commit-config.yaml and pyproject.toml
          version: 0.15.21

  tests:
    # Fork PRs cannot request the OIDC token and must not receive the test
    # identity. The lint job still runs for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # azure/login creates an Azure CLI session. Point DefaultAzureCredential
      # and LanceDB at that session instead of probing for an IMDS endpoint.
      AZURE_TOKEN_CREDENTIALS: AzureCliCredential
      AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      TEST_VECTORDB_URI: ${{ secrets.TEST_VECTORDB_URI }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Azure login (OIDC, test managed identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_TEST_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -n auto --cov=. --cov-report=xml --durations=10 -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
