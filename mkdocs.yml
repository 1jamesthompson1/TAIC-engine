site_name: TAIC Report Engine Documentation
site_description: Documentation for TAIC Report Engine - An AI-powered data pipeline for transport accident investigation reports
site_author: James Thompson
repo_url: https://github.com/1jamesthompson1/TAIC-engine
repo_name: 1jamesthompson1/TAIC-engine

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            summary: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            docstring_section_style: table
            extensions:
            - griffe_pydantic:
                schema: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/styles.css

extra_javascript:
  - assets/header-home.js

nav:
  - Home: index.md
  - User Guide:
      - Overview: user-guide/overview.md
      - Pipeline: user-guide/pipeline.md
      - Pipeline Inputs & Data Sources: user-guide/pipeline-inputs.md
      - Report Processing: user-guide/reports.md
  - Developer Guide:
      - Getting Started: developer-guide/getting-started.md
      - Architecture: developer-guide/architecture.md
      - Contributing: developer-guide/contributing.md
  - API Reference:
      - Overview: api/index.md
      - AICaller: api/aicaller.md
      - AzureStorage: api/azurestorage.md
      - Combine: api/combine.md
      - Config: api/config.md
      - Embedding: api/embedding.md
      - ExtractionModels: api/extractionmodels.md
      - ExtractionPrompts: api/extractionprompts.md
      - Logging: api/logging.md
      - Modes: api/modes.md
      - PDFParsing: api/pdfparsing.md
      - ReportExtracting: api/reportextracting.md
      - SavedDataFrames: api/saveddataframes.md
      - WebsiteScraping: api/websitescraping.md
      - Tests:
          - Overview: api/tests.md
          - TestAICaller: api/test_aicaller.md
          - TestAzureStorage: api/test_azurestorage.md
          - TestCombine: api/test_combine.md
          - TestEmbedding: api/test_embedding.md
          - TestMetadataExtraction: api/test_metadataextraction.md
          - TestPDFParser: api/test_pdfparser.md
          - TestReportExtracting: api/test_reportextracting.md
          - TestWebsiteScraping: api/test_websitescraping.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/1jamesthompson1/TAIC-engine
