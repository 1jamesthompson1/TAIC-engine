engine:
  download:
    end_year: 2025
    max_per_year: 100
    start_year: 2000
    ignored_reports:
    - TAIC_m_2022_202
    - TAIC_m_2022_203
    modes:
    - a
    - r
    - m
    agencies:
    - ATSB
    - TSB
    - TAIC
  output:
    folder_name: tests/data/output
    container_name: engineoutput
    pdf_container_name: test-reportpdfs
    storage:
      container: testengineoutput
    stable_pdf_container_name: test-stable-reportpdfs
  data:
    data_remote_folder_location: https://raw.githubusercontent.com/1jamesthompson1/TAIC-engine/main/data/
    data_local_folder_location: data
    event_types_file_name: event_types.csv
  extraction:
    ai_extraction_config:
      ATSB:
        safety_issues: false
        recommendations: true
      TSB:
        safety_issues: true
        recommendations: false
      TAIC:
        safety_issues: true
        recommendations: false
  vector:
    table_name: all_document_types
    model:
      name: text-embedding-3-large
      context_limit: 8191
