[project]
name = "taic-report-engine"
version = "0.1.0"
description = "An AI powered data pipelines that takes publically available reports from transport accident investigation organisations and turns them into structured datasets (Safety issues, Recommendations, Summaries etc) for downstream applications (Like a RAG chatbot)."
authors = [
    {name = "James", email = "1jamesthompson1@gmail.com"}
]
license = {text = "GPLv3"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["accident", "investigation", "reports", "llm", "analysis"]

dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tiktoken>=0.12.0",
    "pyyaml>=6.0.1",
    "pandas>=2.0.3",
    "regex>=2023.8.8",
    "openai>=1.4.0",
    "matplotlib>=3.8.3",
    "networkx>=3.2.1",
    "tenacity>=8.3.0",
    "numpy>=1.26.0",
    "beautifulsoup4>=4.12.3",
    "tqdm>=4.66.4",
    "hrequests>=0.8.2",
    "roman>=4.2",
    "lancedb>=0.25.0,<0.26",
    "azure-ai-inference>=1.0.0b9",
    "pylance>=0.31.1",
    "pytest>=7.4.3",
    "pytest-xdist>=3.5.0",
    "azure-storage-blob>=12.26.0",
    "pytest-cov>=6.2.1",
    "lxml>=6.0.0",
    "langchain-text-splitters>=1.1.0",
    "pymupdf-layout",
    "pymupdf4llm",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.4",
    "notebook>=7.1.2",
    "openpyxl>=3.1.2",
    "ipywidgets>=8.1.2",
    "pre-commit>=3.7.1",
    "azure-data-tables>=12.7.0",
    "ruff>=0.15.0",
    "pypdf>=6.7.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.urls]
"Homepage" = "https://github.com/1jamesthompson1/TAIC-engine"
"Repository" = "https://github.com/1jamesthompson1/TAIC-engine"
"Bug Tracker" = "https://github.com/1jamesthompson1/TAIC-engine/issues"

[project.scripts]
engine = "engine.cli:cli"
azure = "notebooks.admin.easy_azure:main"

[tool.coverage.report]
include_namespace_packages = true

[tool.coverage.run]
omit = ["tests/*"]

# Disable pytest capture so tests emit a single console-style log
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-n auto -s"
# Disable pytest's live log handler so tests use the centralized engine.Logging
log_cli = false
log_cli_level = "DEBUG"
log_cli_format = "%(levelname).1s %(filename)s - %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]


[tool.setuptools.packages.find]
include = ["engine*"]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "C4",
    "D",
    "DOC",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PD",
    "PIE",
    "PL",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TRY",
    "UP",
    "W",
]

ignore = ["E501", "ANN204"]  # Ignore line too long, and missing return type for special methods

preview = true

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.pydocstyle]
convention = "google"

